<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    body {
      font-family: Arial;
    }
.todogrid,
.todo-input-grid {
    display: grid;
    grid-template-columns:200px 150px 100px ;
   column-gap:  10px;
    row-gap: 10px;
   }


   .todo-input-grid {
   margin-bottom: 10px;
   }
  </style>
</head>
<body>
   <p>To List</p>

     
   <div class="todo-input-grid"> 

     <input type="text" placeholder="input name" class="js-input-name">
    

   <input type="date" class="js-due-date-input">
   <button onclick="
    TodoList();
   ">Add</button>
  </div>


   <div class="js-todo-list todogrid"></div>

   <script>
    // Add button
   const todoList = [{
    name: 'make dinner',
    dueDate: '2025-03-12'
   },{
    name: 'wash dishes',
    dueDate: '2025-03-12'
   }];

     renderTodoList();


   function renderTodoList() {
      let todoListHTML = '';

      for(let i = 0; i<todoList.length; i++) {
        const todoObject = todoList[i];
      /*   const name = todoObject.name;
        const dueDate = todoObject.dueDate
 */
       const {name, dueDate} = todoObject;
        const html = `
       
       <div>   ${name} </div>
       <div> ${dueDate} </div>
     



          <button onclick="
          todoList.splice(${i}, 1);
          renderTodoList();"
          >Delete</button>
       `;
        todoListHTML  += html
      }
         


      document.querySelector('.js-todo-list')
      .innerHTML = todoListHTML;
  }

      function TodoList () {
          const inputElemet = document.querySelector('.js-input-name');

          const name = inputElemet.value;
   const dateInputElemet = document.querySelector('.js-due-date-input');

   const dueDate = dateInputElemet.value;


       // add 
              todoList.push({
                name,
                dueDate
              });

    
           inputElemet.value = ""
           renderTodoList();
    }
   </script>
</body>
</html>
