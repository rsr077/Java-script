<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button onclick="
     PlayGame('Head')

    
    ">Head</button>

  <button onclick=" 
     
       PlayGame('Tail')
       
          
        ">Tail</button>
        <button onclick="
        score.wins =0;
        score.losses=0;
        
        ">Reset Score</button>

  <script>

/* onst score = {
  wins:0,
  losses:0,
  ties:0
}; */


   let score =JSON.parse(localStorage.getItem ('score'));

     if(!score) {
        score = {
          wins:0,
          losses:0,
        
        };
     }

        function PlayGame(playerMove){
          const computerMove =  pickComputerMove()
        let result = ''
        if(playerMove === 'Head'){ 
        if(computerMove === 'Head'){
          result = 'You win.'
        }else if(computerMove === 'Tail'){
          result = 'You lose.'
        }
        }else if(playerMove === 'Tail') {
        
       if(computerMove === 'Head'){
          result = 'You lose.';

       }else if(computerMove === 'Tail'){
          result = 'You win.'
       }
        }

         if(result === 'You win.'){
           score.wins  +=1;
         }else if(result === 'You lose.'){
           score.losses  +=1;
         }

          localStorage.setItem('score',JSON.stringify(score));

        alert(`You chose ${playerMove} . compter chose ${computerMove} ${result}
        wins:${score.wins}, Losses: ${score.losses}`);
        
    }

 
  function pickComputerMove()  {
    let randomNumber = Math.random()
    let computerMove = '';


  if(randomNumber >= 0 && randomNumber <= 1/2 ){
      computerMove = 'Head'
  }else if(randomNumber >= 1/2 && randomNumber <= 1){
    computerMove = 'Tail' 
  }
  
  return computerMove;
  }

  </script>
</body>
