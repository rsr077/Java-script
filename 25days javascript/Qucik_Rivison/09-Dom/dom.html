<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
   .subscribe-button {
    background-color: red;
    border: none;
   }
   .is-subscribed {
    background-color: wheat;
   }
   .hi-button {
    background-color: rgb(225, 161, 161);
   }
   .is-Hi {
    background-color: brown;
   }
  </style>
</head>
<body>
  <p> Youtube Subscribe Button</p>
  <button onclick="
    subscribe();
    " class="js-subscribe-button subscribe-button">Subscrib</button>

  <p>Amazon Shipping Calulator</p>
  <input placeholder="Cost of order" class="js-cost-input"  onkeydown="
  handleCostkeydown(event) ">

  <button onclick="
    claculateTotal();
  ">Calculate</button>
   <p class="js-total-cost"></p>
  
    <script>
       
  function handleCostkeydown(event) {
      if(event.key === 'Enter') {
        claculateTotal();
    }
  }

      function claculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');


       let cost = Number( inputElement.value);

       if(cost < 40 ){
        cost = cost + 10;
       }
         document.querySelector('.js-total-cost')
         .innerHTML = `$${cost}`
      }

 

      function subscribe(){
        const buttoElement = document.querySelector('.js-subscribe-button');

      if(buttoElement.innerHTML  === 'Subscrib'){
        buttoElement.innerHTML = 'Subscribed';
        buttoElement.classList.add('is-subscribed')
      }else {
        buttoElement.innerHTML = 'Subscrib'
        buttoElement.classList.remove('is-subscribed')
      }
      }

        function Hibutton(){
               
      
     const buttonElement = document.querySelector('.js-button ');

         if(buttonElement.innerHTML === 'Hi'){
          buttonElement.innerHTML = 'Hello';
          buttonElement.classList.add('is-Hi')
          
         }else{ 
          buttonElement.innerHTML = 'Hi';
        buttonElement.classList.remove('is-Hi')} 
         
         }
        
    </script>
 
 <button onclick="
 Hibutton();
"class ="js-button hi-button  ">Hi</button>
</body>
</html>
