<body>
  <button onclick="
     PlayGame('Head')

    
    ">Head</button>

  <button onclick=" 
     
       PlayGame('Tail')
      
        ">Tail</button>
        <p class="js-result"></p>
        <p class="js-moves"></p>
        <p class="js-score"></p>
        <button onclick="
        score.wins =0;
        score.losses=0;
        localStorage.removeItem('score')
        updateScoreElement();
        ">Reset Score</button>

  <script>

/* onst score = {
  wins:0,
  losses:0,
  ties:0
}; */


   let score =JSON.parse(localStorage.getItem ('score'))|| {
    wins: 0,
    losses:0,
    ties:0
   };

    /*  if(!score) {
        score = {
          wins:0,

        };
     }
 */
     updateScoreElement(); 

        function PlayGame(playerMove){
          const computerMove =  pickComputerMove()
        let result = ''
        if(playerMove === 'Head'){ 
        if(computerMove === 'Head'){
          result = 'You win.'
        }else if(computerMove === 'Tail'){
          result = 'You lose.'
        }
        }else if(playerMove === 'Tail') {
        
       if(computerMove === 'Head'){
          result = 'You lose.';

       }else if(computerMove === 'Tail'){
          result = 'You win.'
       }
        }

         if(result === 'You win.'){
           score.wins  +=1;
         }else if(result === 'You lose.'){
           score.losses  +=1;
         }

          localStorage.setItem('score',JSON.stringify(score));

        document.querySelector('.js-result')
        .innerHTML = result;
          updateScoreElement();

          document.querySelector('.js-moves')
          .innerHTML = `You ${playerMove} - Computer
          ${computerMove} ` 

        /* alert(`You chose ${playerMove} . computer chose ${computerMove} ${result}
        wins:${score.wins}, Losses: ${score.losses}`);
         */
    }

 
      function updateScoreElement() {
        document.querySelector('.js-score')
        .innerHTML = ` wins:${score.wins}, Losses: ${score.losses}`
      }

  function pickComputerMove()  {
    let randomNumber = Math.random()
    let computerMove = '';


  if(randomNumber >= 0 && randomNumber <= 1/2 ){
      computerMove = 'Head'
  }else if(randomNumber >= 1/2 && randomNumber <= 1){
    computerMove = 'Tail' 
  }
  
  return computerMove;
  }

  </script>
