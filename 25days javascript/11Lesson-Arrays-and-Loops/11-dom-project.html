<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Project </title>
  <style>
    body{
      font-family: 'Arial';
    }
    .subscrie-button {
      border: none;
      background-color: black;
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .is-subscribed  {
      background-color: rgb(240, 240, 240);
      color: black;
    }
    .cost-input{
      font-size: 15px;
      padding: 10px;
    }
    .calulate-button {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      padding: 12px 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <p>Youtub Subscribe Button</p>
  <button onclick="
  

Subscribe();
  "class="js-subscribe-button subscrie-button">Subscribe</button>

  <p>Amazon Shipin Calculator</p>
  <input placeholder="cost of order"
  class="js-cost-input cost-input" onkeydown=" handleCostKeydown(event);">
  <button onclick="
  calculateTotal();
  " class="calulate-button">Calculator</button>
  <p class="js-total-cost"></p>
<script>

function handleCostKeydown(event) {

  if(event.key === 'Enter') {
    calculateTotal();
  }
}

function calculateTotal() {
  const inputElement = document.querySelector('.js-cost-input');

let cost = Number(inputElement.value);

if(cost <40) {
  cost = cost + 10;
}

document.querySelector('.js-total-cost').innerHTML = `$${cost}`;

}

  function Subscribe() {
    const buttonElement =  document.querySelector('.js-subscribe-button');


if (buttonElement.innerHTML === 'Subscribe') {
     buttonElement.innerHTML = 'Subscribed';
     buttonElement.classList.add('is-subscribed');
}else {
  buttonElement.innerHTML = 'Subscribe';
  buttonElement.classList.remove('is-subscribed');
}
  }
</script>

</body>
</html>
