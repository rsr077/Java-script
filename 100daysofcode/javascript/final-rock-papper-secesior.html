<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
     body {
      background-color: rgb(25,25,25);
      color: white;
      font-family: Arial;
     }
     .title {
      font-size: 30px;
      font-weight: bold;
     }
     .move-icon {
      height: 60px;
     }

     .move-button {
       background-color: transparent;
       border:  3px solid white;
       width: 120px;
       height:  120px;
       border-radius: 60px;
       margin-right: 10px;
       cursor: pointer;
     }
     .result {
       font-size: 25px;
       font-weight: bold;
       margin-top: 50px;
     }
     .score {
      margin-top: 60px;

     }
      .reset-score-button,
      .auto-play-button {
        background-color: white;
        border: none;
        font-size: 15px;
        padding: 8px 15px;
        cursor: pointer;
      }
  </style>
</head>
<body>
  <p class="title">Rock Paper Scissors</p>

 <button class="move-button js-rock-button "><img src="img/rock-emoji.png" class="move-icon" > </button>

 <button class="move-button js-paper-button"><img  src="img/paper-emoji.png" class="move-icon"></button>
 <button class="move-button js-scissors-button"
><img  src="img/scissors-emoji.png" class="move-icon"></button>
<p  class="js-result result">You win</p>

<p class="js-moves"></p>

<p class="js-score score"> </p>

<button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updateScoreElement ()
  
" class="reset-score-button">Reset Score</button>

<button class="js-auto-play-button auto-play-button"
onclick="  
autoPlay();
"
>Auto Play</button>
 
<script>
  
/*   const score = {
     wins: 0,
     losses: 0,
     ties: 0
   } */
  
     const score =  JSON.parse(localStorage.getItem('score'))|| {
      wins: 0,
      losses: 0,
      ties: 0
     };

   updateScoreElement ()
 

    /*  if(!score){
      score ={
       wins: 0,
       losses: 0,
       ties: 0
      }
     } */


        // stop auto play 

  let isAutoPlaying = false;
  let intervalId;
    function autoPlay() {
      if(! isAutoPlaying) {
          // auto play 
   intervalId = setInterval(function() {
       
     playGame(pickedComputerMove())
      },1000)

       isAutoPlaying = true;
     }else  {
        clearInterval(intervalId);
        isAutoPlaying = false;
      }
     }
         // replace onclick and using this 



    document.querySelector('.js-rock-button')
    .addEventListener('click',()=> {
      playGame('rock')
    });


    
    document.querySelector('.js-paper-button')
    .addEventListener('click',()=> {
      playGame('paper')
    });

    document.querySelector('.js-scissors-button')
    .addEventListener('click',()=> {
      playGame('scissors')
    });


 document.body.addEventListener('keydown',(event)=> {
     if(event.key === 'r') {
      playGame('rock')
     }else if (event.key === 'p'){
      playGame('paper')
     }else if (event.key === 's'){
       playGame('scissors')
     }
 });

   function playGame(playerMove) {
    const computerMove  =pickedComputerMove()  
    let  result  = '';
    
// parameter

    if(playerMove === 'scissors'){
      if(computerMove === 'rock') {
      result = 'You lose.'
      }else if(computerMove === 'paper'){
      result ='win'
      }else if(computerMove === 'scissors') {
      result = 'Tie'
 }

    } else if(playerMove === 'paper'){
            if(computerMove === 'rock') {
          result = 'win'
        }else if(computerMove === 'paper'){
          result ='Tie'
        }else if(computerMove === 'scissors') {
          result = 'You lose.'
        }
    }else if (playerMove === 'rock'){
          if(computerMove === 'rock') {
          result = 'Tie'
        }else if(computerMove === 'paper'){
          result ='You lose.'
        }else if(computerMove === 'scissors') {
          result = 'win'
        }
    }

  // calculate score

   if(result === 'win'){
    score.wins += 1;
   }else if(result === 'You lose.'){
      score.losses += 1;
   }else if(result === 'Tie'){
      score.ties  +=1;
   }


   localStorage.setItem('.score',JSON.stringify(score) );

   updateScoreElement ()

  //reslut

     document.querySelector('.js-result').innerHTML = result;
  
     
      document.querySelector('.js-moves').innerHTML =    `You 
   <img src="img/${playerMove}-emoji.png" 
   class="move-icon">
   <img src="img/${computerMove}-emoji.png" 
   class="move-icon">
   Computer`


}
         // score

    function updateScoreElement () {
      document.querySelector('.js-score') .innerHTML = ` wins: ${score.wins} ,Losses:${score.losses}, Tie${score.ties}`

    }

 function pickedComputerMove() {
  const randomNumber = Math.random();
  let computerMove = '';

    if(randomNumber >=0 && randomNumber<1/3){
      computerMove = 'rock';
    }else if(randomNumber >= 1/3 && randomNumber <2/3 ){
      computerMove = 'paper';
    }else if(randomNumber >= 2/3  && randomNumber <1) {
      computerMove  = 'scissors';
    }
     return computerMove;
 }

</script>
</body>
</html>
